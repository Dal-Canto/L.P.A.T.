name: Compila Eseguibili Multi-Platform

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
    - name: Controlla codice sorgente
      uses: actions/checkout@v4

    - name: Configura Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Installa dipendenze
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller lark

    - name: Compila con PyInstaller (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        pyinstaller --onefile launcher.py

    - name: Compila con PyInstaller (Mac)
      if: matrix.os == 'macos-latest'
      run: |
        pyinstaller --onefile --windowed launcher.py

    - name: Carica file compilati
      uses: actions/upload-artifact@v4
      with:
        name: L.P.A.T.-${{ matrix.os }}
        path: |
          dist/launcher
          dist/launcher.app
